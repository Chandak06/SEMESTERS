<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Samarpana Marathon Registration</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="title">
      <h1>Registration For Annual Samarpana Marathon</h1>
      <p id="dateTime"></p>
    </div>

    <div class="container">
      <form id="marathonForm">
        <div class="form-container">
          <div class="options">
            <label for="name">Name <span class="required">*</span>:</label>
            <input type="text" name="name" placeholder="Enter your name..." required />
          </div>

          <div class="options">
            <label for="gender">Gender <span class="required">*</span>:</label>
            <div class="genderOptions">
              <label><input type="radio" name="gender" value="Male" /> Male</label>
              <label><input type="radio" name="gender" value="Female" /> Female</label>
              <label><input type="radio" name="gender" value="Other" /> Other</label>
            </div>
          </div>

          <div class="options">
            <label for="phoneNumber">Phone Number <span class="required">*</span>:</label>
            <input type="text" name="phoneNumber" placeholder="10-digit phone number" required />
          </div>

          <div class="options">
            <label for="email">Email <span class="required">*</span>:</label>
            <input type="email" name="email" placeholder="Enter your email address..." required />
          </div>

          <div class="options">
            <label for="address">Address <span class="required">*</span>:</label>
            <textarea name="address" placeholder="Enter your address..." required></textarea>
          </div>

          <div class="options">
            <label for="size">T-Shirt Size <span class="required">*</span>:</label>
            <select name="size" id="size" required>
              <option value="">--Select Size--</option>
              <option value="S">Small (S)</option>
              <option value="M">Medium (M)</option>
              <option value="L">Large (L)</option>
              <option value="XL">Extra Large (XL)</option>
            </select>
          </div>

          <div class="options">
            <h3>T-Shirt Size Reference</h3>
            <table class="sizeTable">
              <tr><th>Size</th><th>Chest (inches)</th><th>Length (inches)</th></tr>
              <tr><td>S</td><td>36</td><td>26</td></tr>
              <tr><td>M</td><td>38</td><td>27</td></tr>
              <tr><td>L</td><td>40</td><td>28</td></tr>
              <tr><td>XL</td><td>42</td><td>29</td></tr>
            </table>
          </div>
        </div>

        <div class="buttons">
            <input type="reset" class="reset">
          <button type="submit">Submit</button>
        </div>
      </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
